<!DOCTYPE html>
<html>
  <head>
    <title>Осінь, 2026: Дослідження і проектування інтелектуальних систем</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <link rel="stylesheet" href="./assets/katex.min.css">
    <link rel="stylesheet" href="./assets/style2.css">
    <link rel="stylesheet" href="./assets/grid.css">
  </head>
  <body>
    <textarea id="source"></textarea>
    <script src="./assets/remark.min.js"></script>
    <script src="./assets/katex.min.js"></script>
    <script src="./assets/auto-render.min.js"></script>

    <script type="text/javascript">
        function getParameterByName(name, url) {
            if (!url) url = window.location.href;
            name = name.replace(/[\[\]]/g, "\\$&");
            var regex = new RegExp("[?&]" + name + "(=([^&#]*)|&|#|$)"),
                results = regex.exec(url);
            if (!results) return null;
            if (!results[2]) return '';
            return decodeURIComponent(results[2].replace(/\+/g, " "));
        }

        var options = {sourceUrl: getParameterByName("p"),
                       highlightStyle: "tomorrow"};
        var renderMath = function() {
            renderMathInElement(document.body, {delimiters: [ // mind the order of delimiters(!?)
                {left: "$$", right: "$$", display: true},
                {left: "$", right: "$", display: false},
                {left: "\\[", right: "\\]", display: true},
                {left: "\\(", right: "\\)", display: false},
            ]});
        }
      var slideshow = remark.create(options, renderMath);
    </script>

                          <!-- малювання на льоту -->
    <script>
      (function () {
        var Z = 2147483647;

        // основне полотно
        var canvas = document.createElement('canvas');
        Object.assign(canvas.style, {
          position: 'fixed', top: 0, left: 0,
          width: '100vw', height: '100vh', display: 'block',
          zIndex: Z, pointerEvents: 'none',
          touchAction: 'none', userSelect: 'none'
        });
        document.documentElement.appendChild(canvas);
        canvas.style.setProperty('position', 'fixed', 'important');
        canvas.style.setProperty('z-index', String(Z), 'important');
        canvas.style.setProperty('display', 'block', 'important');
        var ctx = canvas.getContext('2d');

        // полотно ефектів: указка і маркерний слід
        var lcanvas = document.createElement('canvas');
        Object.assign(lcanvas.style, {
          position: 'fixed', top: 0, left: 0,
          width: '100vw', height: '100vh', display: 'block',
          zIndex: Z, pointerEvents: 'none'
        });
        document.documentElement.appendChild(lcanvas);
        var lctx = lcanvas.getContext('2d');

        // кільце-курсор для гумки
        var ring = document.createElement('div');
        Object.assign(ring.style, {
          position: 'fixed',
          border: '2px solid #333', borderRadius: '50%',
          background: 'rgba(255,255,255,0.4)', boxSizing: 'border-box',
          transform: 'translate(-50%, -50%)',
          zIndex: Z, display: 'none', pointerEvents: 'none'
        });
        document.documentElement.appendChild(ring);

        // мітка з поточним інструментом, кольором і товщиною
        var badge = document.createElement('div');
        Object.assign(badge.style, {
          position: 'fixed', right: '12px', bottom: '12px',
          padding: '6px 12px', font: '14px sans-serif', color: '#fff',
          background: 'rgba(0,0,0,0.65)', borderRadius: '6px',
          lineHeight: '1.4', textAlign: 'left',
          zIndex: Z, display: 'none', pointerEvents: 'none'
        });
        document.documentElement.appendChild(badge);

        // екран зі списком гарячих клавіш (клавіша H)
        var help = document.createElement('div');
        Object.assign(help.style, {
          position: 'fixed', top: '50%', left: '50%',
          transform: 'translate(-50%, -50%)',
          padding: '20px 32px', font: '22px/1.7 sans-serif', color: '#fff',
          background: 'rgba(0,0,0,0.88)', borderRadius: '12px',
          zIndex: Z, display: 'none', pointerEvents: 'none'
        });
        help.innerHTML =
          '<div style="font-size:26px;font-weight:bold;margin-bottom:8px">Гарячі клавіші малювання</div>' +
          '<b>D</b>: увімкнути / вимкнути малювання<br>' +
          '<b>R</b>: перо → прямокутник → лінія → стрілка<br>' +
          '<b>Shift</b> (під час малювання): пряма лінія / рівний кут 45° / квадрат<br>' +
          '<b>E</b>: гумка<br>' +
          '<b>L</b>: указка → маркер → перо<br>' +
          '<b>Колесо миші</b>: товщина лінії / гумки / маркера<br>' +
          '<b>Z</b>: змінити колір<br>' +
          '<b>U</b> або <b>Ctrl+Z</b>: скасувати останню дію<br>' +
          '<b>X</b>: очистити слайд<br>' +
          '<b>H</b> або <b>Esc</b>: закрити це вікно' +
          '<div style="margin-top:10px;font-size:16px;opacity:.7">Малюнки зберігаються окремо для кожного слайда<br>' +
          'Довідка remark: клавіша ?</div>';
        document.documentElement.appendChild(help);

        var colors = ['#e53935', '#1e88e5', '#43a047', '#000000'];
        var ci = 0, enabled = false, drawing = false;
        var tool = 'pen';   // 'pen' | 'rect' | 'line' | 'arrow' | 'eraser' | 'laser' | 'marker'
        var current = null;
        var mx = window.innerWidth / 2, my = window.innerHeight / 2;
        var trail = [];
        var TRAIL_MS = 700;      // тривалість сліду указки
        var MARK_MS = 1500;      // тривалість маркерного сліду
        var loopOn = false;

        // ---- малюнки по слайдах ----
        var slides = {};         // індекс слайда -> масив дій
        var cur = 0;             // поточний слайд
        function acts() { return slides[cur] || (slides[cur] = []); }

        // товщини та межі для колеса миші
        var widths = { pen: 4, eraser: 24, marker: 26 };
        var ranges = {
          pen:    { min: 1,  max: 40,  step: 1 },
          eraser: { min: 6,  max: 120, step: 4 },
          marker: { min: 8,  max: 80,  step: 3 }
        };
        function isShape() { return tool === 'rect' || tool === 'line' || tool === 'arrow'; }
        function wkey() { return isShape() ? 'pen' : tool; }
        function hasWidth() { return !!widths[wkey()] && tool !== 'laser'; }

        var toolNames = { pen: 'Перо', rect: 'Прям.', line: 'Лінія', arrow: 'Стрілка',
                          eraser: 'Гумка', laser: 'Указка', marker: 'Маркер' };
        var toolColors = { eraser: '#999', laser: '#ff1744', marker: '#fdd835' };

        function isEffect() { return tool === 'laser' || tool === 'marker'; }

        function applyCursor() {
          if (!enabled) { document.body.style.cursor = ''; return; }
          document.body.style.cursor =
            (tool === 'laser' || tool === 'eraser') ? 'none' : 'crosshair';
        }

        function updateBadge() {
          badge.style.display = enabled ? 'block' : 'none';
          var txt = '<b>' + toolNames[tool] + '</b>';
          if (tool === 'pen' || isShape()) txt += ' | колір ' + (ci + 1) + '/' + colors.length;
          if (hasWidth()) txt += ' | тов ' + widths[wkey()];
          badge.innerHTML = txt;
          badge.style.borderLeft = '8px solid ' + (toolColors[tool] || colors[ci]);
          updateRing();
        }

        function updateRing() {
          if (enabled && tool === 'eraser') {
            ring.style.display = 'block';
            ring.style.width = ring.style.height = widths.eraser + 'px';
            ring.style.left = mx + 'px';
            ring.style.top = my + 'px';
          } else {
            ring.style.display = 'none';
          }
        }

        // прив'язка кінця відрізка до кроку 45° (для Shift)
        function snapAngle(x0, y0, x, y) {
          var dx = x - x0, dy = y - y0;
          var len = Math.sqrt(dx * dx + dy * dy);
          var ang = Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) * (Math.PI / 4);
          return { x: x0 + len * Math.cos(ang), y: y0 + len * Math.sin(ang) };
        }

        // квадрат для прямокутника з Shift
        function snapSquare(x0, y0, x, y) {
          var dx = x - x0, dy = y - y0;
          var s = Math.max(Math.abs(dx), Math.abs(dy));
          return { x: x0 + (dx < 0 ? -s : s), y: y0 + (dy < 0 ? -s : s) };
        }

        function strokePath(pts, width) {
          ctx.lineWidth = width;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.beginPath();
          ctx.moveTo(pts[0].x, pts[0].y);
          ctx.lineTo(pts[0].x + 0.1, pts[0].y + 0.1);
          for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
          ctx.stroke();
        }

        function drawAction(a) {
          ctx.globalCompositeOperation = 'source-over';
          if (a.type === 'pen') {
            ctx.strokeStyle = a.color;
            strokePath(a.straight ? [a.pts[0], a.straight] : a.pts, a.w);
          } else if (a.type === 'erase') {
            ctx.globalCompositeOperation = 'destination-out';
            ctx.strokeStyle = '#000';
            strokePath(a.pts, a.w);
            ctx.globalCompositeOperation = 'source-over';
          } else if (a.type === 'rect') {
            ctx.lineWidth = a.w;
            ctx.lineJoin = 'round';
            ctx.strokeStyle = a.color;
            ctx.strokeRect(a.x0, a.y0, a.x1 - a.x0, a.y1 - a.y0);
          } else if (a.type === 'line' || a.type === 'arrow') {
            ctx.lineWidth = a.w;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = a.color;
            ctx.beginPath();
            ctx.moveTo(a.x0, a.y0);
            ctx.lineTo(a.x1, a.y1);
            ctx.stroke();
            var dx = a.x1 - a.x0, dy = a.y1 - a.y0;
            if (a.type === 'arrow' && (dx * dx + dy * dy) > 4) {
              var ang = Math.atan2(dy, dx);
              var hl = Math.max(14, a.w * 4);        // довжина наконечника
              var sp = Math.PI / 7;                  // розхил наконечника
              ctx.beginPath();
              ctx.moveTo(a.x1 - hl * Math.cos(ang - sp), a.y1 - hl * Math.sin(ang - sp));
              ctx.lineTo(a.x1, a.y1);
              ctx.lineTo(a.x1 - hl * Math.cos(ang + sp), a.y1 - hl * Math.sin(ang + sp));
              ctx.stroke();
            }
          }
        }

        function redraw(extra) {
          ctx.globalCompositeOperation = 'source-over';
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          var list = acts();
          for (var i = 0; i < list.length; i++) {
            if (list[i].type === 'clear') ctx.clearRect(0, 0, canvas.width, canvas.height);
            else drawAction(list[i]);
          }
          if (extra) drawAction(extra);
        }

        function setup() {
          canvas.width = lcanvas.width = window.innerWidth;
          canvas.height = lcanvas.height = window.innerHeight;
          redraw();
        }
        setup();
        window.addEventListener('resize', setup);

        // ---- ефекти: указка і маркерний слід ----
        function drawLaser(now) {
          lctx.lineCap = 'round';
          lctx.lineJoin = 'round';
          for (var i = 1; i < trail.length; i++) {
            var age = (now - trail[i].t) / TRAIL_MS;
            lctx.strokeStyle = 'rgba(255,23,68,' + (0.8 * (1 - age)).toFixed(3) + ')';
            lctx.lineWidth = 6 * (1 - age) + 1;
            lctx.beginPath();
            lctx.moveTo(trail[i - 1].x, trail[i - 1].y);
            lctx.lineTo(trail[i].x, trail[i].y);
            lctx.stroke();
          }
          if (enabled && tool === 'laser') {
            lctx.shadowColor = '#ff1744';
            lctx.shadowBlur = 18;
            lctx.fillStyle = '#ff1744';
            lctx.beginPath();
            lctx.arc(mx, my, 8, 0, Math.PI * 2);
            lctx.fill();
            lctx.shadowBlur = 0;
            lctx.fillStyle = 'rgba(255,255,255,0.85)';
            lctx.beginPath();
            lctx.arc(mx, my, 3, 0, Math.PI * 2);
            lctx.fill();
          }
        }

        function drawMarker(now) {
          lctx.lineCap = 'butt';
          lctx.lineJoin = 'round';
          lctx.lineWidth = widths.marker;
          var n = trail.length;
          for (var s = 0; s < n - 1; s += 5) {
            var e = Math.min(s + 6, n);
            var age = (now - trail[s].t) / MARK_MS;
            lctx.strokeStyle = 'rgba(255,235,59,' + (0.5 * (1 - age)).toFixed(3) + ')';
            lctx.beginPath();
            lctx.moveTo(trail[s].x, trail[s].y);
            for (var i = s + 1; i < e; i++) lctx.lineTo(trail[i].x, trail[i].y);
            lctx.stroke();
          }
        }

        function frame() {
          var now = Date.now();
          lctx.clearRect(0, 0, lcanvas.width, lcanvas.height);
          var ttl = (tool === 'marker') ? MARK_MS : TRAIL_MS;
          while (trail.length && now - trail[0].t > ttl) trail.shift();

          if (tool === 'marker') drawMarker(now);
          else drawLaser(now);

          if ((enabled && isEffect()) || trail.length) {
            requestAnimationFrame(frame);
          } else {
            loopOn = false;
            lctx.clearRect(0, 0, lcanvas.width, lcanvas.height);
          }
        }
        function startLoop() {
          if (!loopOn) { loopOn = true; requestAnimationFrame(frame); }
        }

        function stop(e) { e.preventDefault(); e.stopPropagation(); }

        window.addEventListener('mousedown', function (e) {
          if (!enabled) return;
          stop(e);
          if (isEffect()) return;
          drawing = true;
          var p = { x: e.clientX, y: e.clientY };
          if (tool === 'pen') {
            current = { type: 'pen', color: colors[ci], w: widths.pen, pts: [p], straight: null };
            drawAction(current);
          } else if (tool === 'eraser') {
            current = { type: 'erase', w: widths.eraser, pts: [p] };
            drawAction(current);
          } else {
            current = { type: tool, color: colors[ci], w: widths.pen,
                        x0: p.x, y0: p.y, x1: p.x, y1: p.y };
          }
        }, true);

        window.addEventListener('mousemove', function (e) {
          if (!enabled) return;
          mx = e.clientX; my = e.clientY;

          if (isEffect()) {
            trail.push({ x: mx, y: my, t: Date.now() });
            startLoop();
            return;
          }
          if (tool === 'eraser') updateRing();

          if (!drawing || !current) return;
          stop(e);

          if (current.type === 'erase') {
            var le = current.pts[current.pts.length - 1];
            current.pts.push({ x: mx, y: my });
            ctx.globalCompositeOperation = 'destination-out';
            ctx.strokeStyle = '#000';
            ctx.lineWidth = current.w;
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(le.x, le.y);
            ctx.lineTo(mx, my);
            ctx.stroke();
            ctx.globalCompositeOperation = 'source-over';
          } else if (current.type === 'pen') {
            if (e.shiftKey) {
              // Shift: пряма лінія від початку штриха (з прив'язкою до 45°)
              var s0 = current.pts[0];
              current.straight = snapAngle(s0.x, s0.y, mx, my);
              redraw(current);
            } else if (current.straight) {
              // Shift відпустили: повертаємось до вільного малювання
              current.straight = null;
              current.pts.push({ x: mx, y: my });
              redraw(current);
            } else {
              var lp = current.pts[current.pts.length - 1];
              current.pts.push({ x: mx, y: my });
              ctx.strokeStyle = current.color;
              ctx.lineWidth = current.w;
              ctx.lineCap = 'round'; ctx.lineJoin = 'round';
              ctx.beginPath();
              ctx.moveTo(lp.x, lp.y);
              ctx.lineTo(mx, my);
              ctx.stroke();
            }
          } else {
            // прямокутник, лінія, стрілка
            var q = { x: mx, y: my };
            if (e.shiftKey) {
              q = (current.type === 'rect')
                ? snapSquare(current.x0, current.y0, mx, my)
                : snapAngle(current.x0, current.y0, mx, my);
            }
            current.x1 = q.x;
            current.y1 = q.y;
            redraw(current);
          }
        }, true);

        window.addEventListener('mouseup', function (e) {
          if (!enabled) return;
          stop(e);
          if (drawing && current) {
            acts().push(current);
            current = null;
          }
          drawing = false;
        }, true);

        // колесо миші: товщина лінії / гумки / маркера
        window.addEventListener('wheel', function (e) {
          if (!enabled || !hasWidth()) return;
          e.preventDefault();
          e.stopPropagation();
          var k = wkey(), r = ranges[k];
          var dir = e.deltaY < 0 ? 1 : -1;
          widths[k] = Math.max(r.min, Math.min(r.max, widths[k] + dir * r.step));
          updateBadge();
        }, { capture: true, passive: false });

        window.addEventListener('selectstart', function (e) {
          if (enabled) e.preventDefault();
        }, true);
        window.addEventListener('dragstart', function (e) {
          if (enabled) e.preventDefault();
        }, true);
        window.addEventListener('click', function (e) {
          if (enabled) stop(e);
        }, true);

        function undo() {
          var list = acts();
          if (list.length) { list.pop(); redraw(); }
        }

        function setTool(t) {
          tool = t;
          drawing = false;
          current = null;
          trail = [];
          lctx.clearRect(0, 0, lcanvas.width, lcanvas.height);
          updateBadge();
          applyCursor();
          startLoop();
        }

        window.addEventListener('keydown', function (e) {
          // Ctrl+Z: скасувати останню дію (лише в режимі малювання)
          if (e.ctrlKey && !e.altKey && !e.metaKey && e.code === 'KeyZ' && enabled) {
            e.preventDefault();
            undo();
            return;
          }
          if (e.ctrlKey || e.altKey || e.metaKey) return;

          if (e.code === 'KeyH') {
            e.preventDefault();
            e.stopPropagation();               // щоб не відкривалась довідка remark
            help.style.display = (help.style.display === 'none') ? 'block' : 'none';
            return;
          }
          if (e.code === 'Escape' && help.style.display === 'block') {
            help.style.display = 'none';
            return;
          }

          if (e.code === 'KeyD') {
            enabled = !enabled;
            drawing = false;
            current = null;
            trail = [];
            canvas.style.pointerEvents = enabled ? 'auto' : 'none';
            document.body.style.userSelect = enabled ? 'none' : '';
            document.body.style.outline = enabled ? '4px solid #e53935' : '';
            document.body.style.outlineOffset = '-4px';
            window.getSelection().removeAllRanges();
            updateBadge();
            applyCursor();
            startLoop();
          } else if (!enabled) {
            return;
          } else if (e.code === 'KeyR') {      // перо → прямокутник → лінія → стрілка
            var order = ['pen', 'rect', 'line', 'arrow'];
            var i = order.indexOf(tool);
            setTool(order[(i + 1) % order.length]);   // з інших інструментів (i = -1) іде перо
          } else if (e.code === 'KeyE') {      // гумка (повторне: перо)
            setTool(tool === 'eraser' ? 'pen' : 'eraser');
          } else if (e.code === 'KeyL') {      // указка → маркер → перо
            if (tool === 'laser') setTool('marker');
            else if (tool === 'marker') setTool('pen');
            else setTool('laser');
          } else if (e.code === 'KeyU') {
            undo();
          } else if (e.code === 'KeyX') {      // очистити поточний слайд (можна скасувати)
            acts().push({ type: 'clear' });
            redraw();
          } else if (e.code === 'KeyZ') {
            ci = (ci + 1) % colors.length;
            updateBadge();
          }
        }, true);

        // при зміні слайда показуємо його власний малюнок
        slideshow.on('showSlide', function (slide) {
          var idx = slide.getSlideIndex();
          if (idx !== cur) {
            cur = idx;
            current = null;
            drawing = false;
            redraw();
          }
        });
      })();
    </script>
  </body>
</html>
